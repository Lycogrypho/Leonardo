"1814.0225">e&#160;&#160;&#160;&#160;&#160;&#160;:&#160;_Expression</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="386.4629" x="29959.86" y="1832.3018">coords&#160;:&#160;Vector[_Variable]&#160;&#160;&#160;(ORDERED;&#160;free&#160;in</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="268.8438" x="29959.86" y="1850.5811">the&#160;result,&#160;never&#160;substituted&#160;--</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="310.8506" x="29959.86" y="1868.8604">the&#160;_Taylor&#160;convention,&#160;not&#160;a&#160;binder)</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="210.0342" x="29959.86" y="1887.1396">system&#160;:&#160;CoordinateSystem</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="386.4629" x="29959.86" y="1905.4189">componentsOf():&#160;reads&#160;a&#160;LITERAL&#160;matrix&#160;without</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="378.0615" x="29959.86" y="1923.6982">evaluating&#160;--&#160;evaluating&#160;first&#160;would&#160;collapse</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="302.4492" x="29959.86" y="1941.9775">symbolic&#160;cells&#160;to&#160;constants&#160;once&#160;the</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="252.041" x="29959.86" y="1960.2568">coordinates&#160;happen&#160;to&#160;be&#160;bound</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="394.8643" x="29959.86" y="2000.8154">scaleFactors:&#160;(1,1,1)&#160;|&#160;(1,r,1)&#160;|&#160;(1,r,r&#160;sin&#160;t)</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="201.6328" x="29959.86" y="2019.0947">