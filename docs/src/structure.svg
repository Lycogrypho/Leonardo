00" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="252.041" x="31145.66" y="1545.8154">INTERESTING&#160;case,&#160;not&#160;an&#160;error</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="386.4629" x="31145.66" y="1564.0947">isStable:&#160;from&#160;the&#160;POLES,&#160;not&#160;Routh&#160;--&#160;Routh's</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="310.8506" x="31145.66" y="1582.374">degenerate&#160;cases&#160;give&#160;a&#160;wrong&#160;verdict</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="285.6465" x="31145.66" y="1600.6533">rather&#160;than&#160;a&#160;refusal.&#160;&#160;STRICT,&#160;so</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="294.0479" x="31145.66" y="1618.9326">marginal&#160;stability&#160;is&#160;not&#160;stability</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="319.252" x="31145.66" y="1637.2119">isStableDiscrete:&#160;UNIT&#160;CIRCLE,&#160;not&#160;LHP</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="159.626" x="31145.66" y="1655.4912">routhTable&#160;/&#160;dcgain</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="344.4561" x="31145.66" y="1673.7705">bode&#160;/&#160;nyquist:&#160;one&#160;substitution&#160;s&#160;-&gt;&#160;i*w</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="268.8438" x="31145.66" y="1692.0498">on&#160;the&#160;existing&#160;_Complex&#160;closure</text><line style="stroke:#5B7FBF;stroke-width:0.5;" x1="31140.66" x2="31183.4662" y1="1394.6455" y2="1394.6455"/><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="310.8506" x="31183.4662" y="1399.0811">coeffsOf:&#160;the