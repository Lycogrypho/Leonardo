name: Release

# Publishes to Maven Central (issue 5.2 phase 2), then creates the GitHub Release.
#
# Releasing is `git tag 3.6.4 && git push origin 3.6.4` and nothing else: sbt-dynver derives
# the version from the tag, so there is no version string to edit and no way for the tag and
# the artifact to disagree. An untagged push publishes a -SNAPSHOT instead.
#
# The Release notes come from the tag's section in CHANGELOG.md, so write that section BEFORE
# tagging -- the workflow reads the file as it stands at the tagged commit, and a missing
# section degrades to auto-generated notes with a warning rather than failing.
#
# Every Release also carries `leonardo-app-<version>.zip`, the browser REPL as a directory
# anyone can serve (D_0026 step 3). It is assembled by `sbt app`, the same task pages.yml
# deploys from, so the downloadable bundle and the live /app cannot drift -- and since the app
# embeds no version string, being attached to the tag is the ONLY thing that says which build
# it is. Nothing else about releasing changes: it is still a tag and nothing else.
#
# The four secrets this needs are documented in the `env` block below. None of them lives in
# the repository.

on:
  push:
    tags:
      # The release tags here are BARE (`3.6.3`), not `v`-prefixed -- see `dynverVTagPrefix`
      # in build.sbt. The 16 abandoned `v*` tags must never match, or pushing one would
      # publish from the wrong history.
      - "[0-9]+.[0-9]+.[0-9]+"
    # NO `branches:` filter here. Listing both makes the workflow fire on EITHER a matching
    # tag OR a push to that branch -- it does not restrict tags to the branch, which is what
    # it looks like it does. With `branches: [main]` present this ran `ci-release` on every
    # push to main, publishing a -SNAPSHOT each time and failing red before the secrets exist.
    # A tag is the only thing that should trigger a release.

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # BOTH of these are load-bearing. sbt-dynver derives the version from `git describe`,
          # so a shallow clone without tags yields `0.0.0-<sha>` and silently publishes a
          # version unrelated to the tag that triggered the run.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Test
        # The suite runs before publishing, not after: a release to Central is IRREVOCABLE --
        # a version number can never be reused or replaced, only superseded. This is the last
        # point at which a bad build is still free to discard.
        run: sbt test

      - name: Publish
        run: sbt ci-release
        env:
          # PGP_SECRET      base64 of the ARMORED private key:
          #                   gpg --armor --export-secret-keys <KEYID>   then base64 it
          # PGP_PASSPHRASE  that key's passphrase (must be non-empty)
          # SONATYPE_*      the Central Portal *user token* pair, not the portal login
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

  # A SEPARATE job, and the separation is the point: this one needs `contents: write` to create
  # the Release, while `publish` above holds the GPG key. Keeping them apart means the job that
  # can sign artifacts cannot write to the repository, and the job that can write to the
  # repository never sees a secret. `needs:` also delays the Release until Central has actually
  # accepted the artifacts -- a Release pointing at a publish that failed is worse than none.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # CHANGELOG.md is read and the app bundle is built from the sources at this commit, so
        # the default shallow clone is still enough: every file is present at depth 1, and the
        # bundle carries NO version string of its own -- which is exactly why the asset's name
        # and its attachment to the tag are what answer "which app build is this?".

      # sbt is set up in this job as well as in `publish`, which is what keeps the two apart:
      # nothing NEW enters the workflow (the same two actions at the same pinned SHAs), and the
      # job that can write to the repository still never sees a secret. Passing the bundle from
      # `publish` as a workflow artifact was the alternative, and it would have added a
      # third-party action to the job that holds the GPG key -- the one thing this file avoids.
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Create GitHub Release from the tag
        # `gh` rather than a release action, deliberately. It is preinstalled on the runner, so
        # this adds NO third-party code to the workflow that holds the signing key -- which is
        # the whole reason issue 2.10 pinned every action to a SHA in the first place. Nothing
        # to pin, nothing for Dependabot to bump, nothing whose owner can change what runs.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # CHANGELOG.md is the single source of the notes, so the published Release and the
          # file in the repository cannot drift. Extract this version's section: everything
          # between its `## <version>` heading and the next `##` heading.
          # Matches `## 3.8.0` and `## 3.8.0 - 2026-01-31` alike: exact, or the heading
          # followed by a space. The trailing space is what keeps 3.7.1 from also matching a
          # hypothetical 3.7.10 section. Comparing by index rather than by regex avoids having
          # to escape the dots in the version.
          notes=$(awk -v want="## $VERSION" '
            !grab && ($0 == want || index($0, want " ") == 1) { grab = 1; next }
            grab && /^## /                                    { exit }
            grab                                              { print }
          ' CHANGELOG.md)

          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            # No section for this tag: fall back to generated notes rather than failing the
            # release. The artifacts are already on Central at this point and cannot be undone,
            # so refusing here would leave a published version with no Release at all.
            echo "::warning::no CHANGELOG.md section for $VERSION; using generated notes"
            gh release create "$VERSION" --title "$VERSION" --verify-tag --generate-notes
          else
            printf '%s\n' "$notes" |
              gh release create "$VERSION" --title "$VERSION" --verify-tag --notes-file -
          fi

      - name: Attach the browser REPL to the Release
        # AFTER the Release exists, deliberately: `gh release upload` needs one, and building
        # first would mean a link failure leaves a published Central version with no Release at
        # all -- the same reasoning the missing-CHANGELOG fallback above follows. A failed
        # upload leaves the Release standing and the run red, which is visible and repairable;
        # a re-run replaces the asset rather than failing on it (--clobber).
        #
        # `sbt app` is the single definition of what the app is (D_0026): the same directory
        # pages.yml deploys to /app, so the downloadable bundle and the live one cannot drift.
        # The zip holds ONE top-level directory, so unpacking it into a web root produces a
        # named folder rather than scattering index.html and vendor/ into the current one.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sbt app
          cp -r web/target/app "leonardo-app-$VERSION"
          zip -r -q "leonardo-app-$VERSION.zip" "leonardo-app-$VERSION"
          gh release upload "$VERSION" "leonardo-app-$VERSION.zip" --clobber
          echo "attached leonardo-app-$VERSION.zip ($(stat -c%s "leonardo-app-$VERSION.zip") bytes)"
