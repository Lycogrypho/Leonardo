name: CI

# The continuous-integration build: compile and run the full suite on every push and pull
# request. This is what the build badge in README.md reports, and it is what makes a Scala
# Steward dependency-update PR meaningful -- an update is accepted or rejected on the evidence
# of a green suite, which requires that the suite actually runs on the PR.
#
# Deliberately separate from release.yml, which runs only on a version tag: a release must not
# be a side effect of an ordinary push, and CI must not need the signing secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the in-flight run: the older result is about
# to be superseded and would only burn a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Test
        # Aggregated from the root project, which since the Scala.js cross-build (F_0003)
        # covers FOUR suites -- the library on the JVM and the same suites on Node, then the
        # REPL on each (the Node REPL is shorter: the JLine and file-IO cases are JVM-only).
        # `core.js` is aggregated precisely so that a bare `sbt test` cannot forget it.
        #
        # The counts live in CLAUDE.md rather than here: a figure in a comment is wrong from
        # the next test onwards, and this one was (it said THREE suites long after phase 2
        # added the fourth).
        #
        # Node is required for the Scala.js run and the runner image already provides it, so
        # there is no setup step -- if that ever changes, this is the job that goes red first.
        run: sbt test

      - name: Browser front end
        # The `web` project is deliberately NOT in the root aggregate -- linking a bundle on
        # every `sbt test` would put front-end work in the path of every library change -- so
        # it has to be named here or it would never be built at all.
        #
        # check-web-app.js is the part worth having: it drives the linked bundle's entry point
        # against a minimal fake DOM, which is the only thing that checks index.html's element
        # ids against App.scala. A typo there is invisible until someone opens the page; this
        # turns it into a red build. It also pins that a line still evaluates, that the history
        # keys work, and that `plot` emits a document Plotly could read -- including that a
        # coordinates plot carries its aspect lock, which is the whole reason Plotly was chosen
        # over Vega-Lite (F_0003 Decision 1).
        #
        # The sizes are PRINTED, not asserted: a threshold would be either so loose it never
        # fires or so tight it fails on an unrelated Scala.js release. A figure in the log lets
        # a regression be seen by comparing two runs, which is what anyone would actually do.
        #
        # The bundle path is a GLOB and must stay one (issue F_0023): a hardcoded
        # scala-<version> makes Scala Steward's bump branch edit this workflow, and pushing a
        # workflow change is refused for a PAT without the `workflow` scope -- failing the
        # whole run. pages.yml records that incident; this file kept the literal anyway,
        # which is why the CheckScalaVersion guard now enforces the rule instead of a comment.
        # A fresh checkout links exactly one scala-* directory, and `ls` fails loudly if none.
        run: |
          sbt web/test web/fullLinkJS
          node .github/scripts/check-web-app.js
          bundle=$(ls web/target/scala-*/leonardo-web-opt/main.js)
          echo "leonardo: $(stat -c%s "$bundle") raw / $(gzip -c "$bundle" | wc -c) gzipped"
          echo "plotly:   $(stat -c%s web/vendor/plotly.min.js) raw / $(gzip -c web/vendor/plotly.min.js | wc -c) gzipped"
          echo "mathlive: $(stat -c%s web/vendor/mathlive/mathlive.min.js) raw / $(gzip -c web/vendor/mathlive/mathlive.min.js | wc -c) gzipped"

      - name: Repository guards
        # Four standing checks, each guarding a one-time repair of a condition that decays
        # silently -- which is the whole argument for a check rather than a note:
        #
        #   mojibake     issue 2.8. 27 test files had accumulated UTF-8-read-as-cp1252
        #                damage, largely by copy-paste from an already-damaged neighbour.
        #   charset      the safety net for that repair, because the repair itself can err:
        #                reversing the round trip on text that was never damaged occasionally
        #                yields valid UTF-8 by coincidence (`×–` becomes a Hebrew letter), so
        #                a result in a script this codebase never uses is the evidence.
        #   actionPins   issue 2.10. Every `uses:` must name a commit SHA: a tag is mutable
        #                and `ruby/setup-ruby@v1` is a *branch*, so an unpinned action lets
        #                its owner change what runs in release.yml, which holds the GPG key,
        #                and scala-steward.yml, which holds a repository-writing PAT.
        #   scalaVersion issue F_0023, and the one with the best evidence of the four:
        #                pages.yml removed its `scala-<version>` literal AND wrote the
        #                incident above the glob that replaced it, and ci.yml carried the
        #                same literal regardless.
        #
        # They are Scala since F_0027, run through the `checks` alias -- ONE sbt boot for all
        # four, and the same command a contributor runs locally. No toolchain beyond the JDK
        # and sbt this job already installs.
        #
        # The alias names NO PATHS since F_0028: each guard defaults to `Files.GuardedRoots`,
        # so what CI scans is decided in one Scala constant rather than in a workflow line
        # nobody re-reads -- and that line had been wrong, missing the four CrossType.Pure
        # platform trees, the build definition and the root documents.
        #
        # `tools/test` joins the same invocation for a second reason: the guards' own suite,
        # which the Python originals never had, was a separate step and therefore a second sbt
        # boot costing ~25 s for nothing. It must still be named explicitly -- `tools` is
        # outside the root aggregate (the `web` precedent), so folding it into `sbt test`
        # would quietly change what that number means. Each command labels its own output, so
        # one step costs no log clarity.
        run: sbt checks tools/test

      - name: Binary compatibility
        # Checks both published modules against the `mimaBaseline` in build.sbt (issue 2.9).
        # `versionScheme := early-semver` promises that a patch release stays binary-compatible;
        # this is what enforces it. An intended break is declared in `mimaBinaryIssueFilters`
        # with a comment, so the diff shows the decision rather than hiding it.
        run: sbt mimaReportBinaryIssues

      - name: Scaladoc
        # `doc`, not `unidoc`: this is the per-module API that `packageDoc` publishes as the
        # -javadoc.jar, so a release cannot fail on a documentation error that CI never saw.
        # The full site (unidoc + mdoc + PlantUML) is built by pages.yml instead.
        run: sbt doc
