# Jekyll configuration for the Leonardo documentation site (GitHub Pages).
#
# The prose pages are authored in docs/src (shared with the mdoc / Scaladoc pipeline), but
# this config drives the "Just the Docs" theme over mdoc's OUTPUT, not that input -- the
# samples have to be evaluated and their fence modifiers stripped before kramdown sees
# them. The build is run from CI (.github/workflows/pages.yml) as:
#
#   bundle exec jekyll build --source ../target/mdoc --destination ../_site --config _config.yml
#
# The Scaladoc API reference is injected into the built site under /api by the workflow
# (it is NOT produced by Jekyll). See docs/README.md for the full build story.

title: Leonardo
description: A Scala 3 symbolic mathematics library and Computer Algebra System (CAS).

# GitHub project page: https://lycogrypho.github.io/Leonardo/
# `url` is the origin, `baseurl` the repo sub-path. If the repo is renamed or served
# from a user/apex domain, update both (baseurl "" for a user/apex site).
url: "https://lycogrypho.github.io"
baseurl: "/Leonardo"

# Remote theme — no local theme gem needed; resolved by jekyll-remote-theme.
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  # Provides the `{% include_cached %}` tag that the Just the Docs layouts use. The theme
  # declares it as a runtime dependency, but `remote_theme` fetches only the theme's files,
  # so it has to be requested here and in the Gemfile explicitly.
  - jekyll-include-cache

# Turn the existing inter-page `foo.md` links into permalinks (so both the Scaladoc
# site and the Jekyll site can share the same markdown source unchanged).
relative_links:
  enabled: true
  collections: false

# Every page uses the theme's default layout without needing per-page front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# ── Just the Docs options ──────────────────────────────────────────────────────
# Renders in place of the text site title in the sidebar (the theme's title.html switches
# on this).  Banner.svg rather than logo.svg for two reasons: it carries the word
# "Leonardo", which is what a title should do, and it has intrinsic dimensions (402x117)
# where logo.svg has only a viewBox -- see the note in docs/README.md about why that
# matters.  The path is passed through `relative_url`, so the leading "/" picks up the
# baseurl and must NOT include it.
logo: "/Banner.svg"

search_enabled: true
heading_anchors: true

aux_links:
  "API (Scaladoc)":
    - "/Leonardo/api/"
  "GitHub":
    - "https://github.com/Lycogrypho/Leonardo"
aux_links_new_tab: false

# Large/duplicate source assets and non-site files that must not be published.
# Kept, and every one of them is REFERENCED -- do not add these to the list:
#   Banner.svg   the sidebar logo (`logo:` above), the index header, and the Scaladoc
#                `-project-logo`, so both published views are branded identically
#   logo_bw.svg  the per-page inline logo carried by each prose page
#   structure.svg  referenced by architecture.md
exclude:
  - logo.svg
  - logo2.svg
  - logo_bkp.svg
  - logo_bkp2.svg
  - _assets
  - Gemfile
  - Gemfile.lock
  - "*.puml"
