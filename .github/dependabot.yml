version: 2

# Keeps the SHA-pinned GitHub Actions moving (issue 2.10).
#
# Every `uses:` in .github/workflows is pinned to a commit SHA rather than a tag, because a
# tag is mutable -- and `ruby/setup-ruby@v1` was not even a tag but a *branch*, whose head
# moves on every push to it. Whoever controls an action repository can therefore change the
# code that runs in `release.yml`, which holds the GPG signing key, and `scala-steward.yml`,
# which holds a repository-writing PAT.
#
# Pinning alone would only trade one risk for another: a frozen SHA never receives the
# action's own security fixes, and nothing would tell us. Dependabot bumps the SHA and
# rewrites the trailing `# vX.Y.Z` comment, so the pins stay current *deliberately* -- each
# update arriving as a reviewable pull request rather than silently at the next run.
#
# DELIBERATELY LIMITED TO github-actions. Scala/sbt dependencies are Scala Steward's job
# (.scala-steward.conf); enabling Dependabot's `sbt` ecosystem as well would open two pull
# requests for every library update and lose spire's deliberate pin (issue 4.N).
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Grouped so a quiet week is one review rather than seven.
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "Minor Enhancement - 2.10"

  # The documentation site's Ruby gems (issue 2.14).
  #
  # Jekyll and its plugins were the last dependency set here that nothing tracked: actions
  # are SHA-pinned above, Scala libraries are versioned in build.sbt and bumped by Scala
  # Steward. The exposure is real but bounded -- `pages.yml` runs with `contents: read`,
  # `pages: write`, `id-token: write`, so a compromised gem executing during `jekyll build`
  # could deface the published site, but cannot reach the GPG signing key in release.yml or
  # the repository-writing PAT in scala-steward.yml.
  #
  # THIS ENTRY IS ONLY HALF THE FIX, deliberately. Against a Gemfile alone Dependabot can
  # act only when a release falls OUTSIDE the `~>` constraint -- a jekyll 5.0 -- which
  # catches the build-breaking case but not the supply-chain one, because a malicious patch
  # release already satisfies `~> 4.3`. Pinning the transitive closure needs a committed
  # `docs/Gemfile.lock`, which must be generated by a Ruby toolchain; the open half of
  # issue 2.14 carries that.
  #
  # No collision with Scala Steward, which never touches Ruby.
  - package-ecosystem: bundler
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
    groups:
      jekyll:
        patterns:
          - "*"
    labels:
      - dependencies
      - documentation
    commit-message:
      prefix: "Minor Enhancement - 2.14"
