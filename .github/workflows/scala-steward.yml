name: Scala Steward

# Dependency hygiene for issue 5.2 phase 5: nothing watched the dependencies before this.
# Steward opens a pull request per available update; CI runs the full suite against it, so
# an update is accepted or rejected on evidence rather than on the version number.
#
# Policy (which dependencies are ignored, and why spire is pinned) lives in
# `.scala-steward.conf` at the repository root.

on:
  schedule:
    # Mondays at 04:00 UTC. Weekly is ample for a library whose one volatile dependency is
    # deliberately pinned; a shorter interval would only produce noise to close.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        with:
          # THE DEFAULT GITHUB_TOKEN IS NOT ENOUGH HERE, in two separate ways.
          #
          # 1. It is blocked outright unless the repository allows it: Settings -> Actions ->
          #    General -> Workflow permissions -> "Allow GitHub Actions to create and approve
          #    pull requests". Without that, every run dies with
          #    403 "GitHub Actions is not permitted to create or approve pull requests".
          # 2. Even once allowed, pull requests it opens do NOT trigger other workflows --
          #    GitHub suppresses that to prevent recursion -- so the suite would never run on
          #    Steward's PRs and the evidence this automation exists to produce would be
          #    missing.
          #
          # A fine-grained PAT avoids both: it is a user token, so neither restriction
          # applies. Grant it contents:write + pull-requests:write on this repository and
          # store it as the repository secret STEWARD_TOKEN.
          github-token: ${{ secrets.STEWARD_TOKEN || secrets.GITHUB_TOKEN }}

          # WITHOUT THESE THE ACTION REFUSES TO START, and the message names neither the token
          # nor the permissions: "Unable to find author's email. Either ensure that the token's
          # GitHub Account has the email privacy feature disabled for at least one email or use
          # the `author-email` input to provide one."
          #
          # Steward has to author commits, so it asks the API for the token owner's email. With
          # GitHub's email privacy enabled -- the sensible setting, and the one in force here --
          # the API returns none and the run stops before doing any work. It fails in seconds
          # and never reaches a dependency, which is what makes it look like an auth problem.
          #
          # The `@users.noreply.github.com` form is GitHub's own answer to this: it keeps the
          # real address private, and GitHub still attributes the commits to the account, so
          # disabling email privacy to satisfy a bot is not necessary.
          #
          # The author NAME is deliberately not the maintainer's. Steward's commits should be
          # identifiable as machine-generated in `git log`, the way `dependabot[bot]` already
          # is; a bot committing under a human's name removes a signal for no benefit.
          author-name: Scala Steward
          author-email: 115467880+Lycogrypho@users.noreply.github.com
