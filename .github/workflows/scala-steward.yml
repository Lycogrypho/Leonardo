name: Scala Steward

# Dependency hygiene for issue 5.2 phase 5: nothing watched the dependencies before this.
# Steward opens a pull request per available update; CI runs the full suite against it, so
# an update is accepted or rejected on evidence rather than on the version number.
#
# Policy (which dependencies are ignored, and why spire is pinned) lives in
# `.scala-steward.conf` at the repository root.

on:
  schedule:
    # Mondays at 04:00 UTC. Weekly is ample for a library whose one volatile dependency is
    # deliberately pinned; a shorter interval would only produce noise to close.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Run Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        with:
          # THE DEFAULT GITHUB_TOKEN IS NOT ENOUGH HERE, in two separate ways.
          #
          # 1. It is blocked outright unless the repository allows it: Settings -> Actions ->
          #    General -> Workflow permissions -> "Allow GitHub Actions to create and approve
          #    pull requests". Without that, every run dies with
          #    403 "GitHub Actions is not permitted to create or approve pull requests".
          # 2. Even once allowed, pull requests it opens do NOT trigger other workflows --
          #    GitHub suppresses that to prevent recursion -- so the suite would never run on
          #    Steward's PRs and the evidence this automation exists to produce would be
          #    missing.
          #
          # A fine-grained PAT avoids both: it is a user token, so neither restriction
          # applies. Grant it contents:write + pull-requests:write on this repository and
          # store it as the repository secret STEWARD_TOKEN.
          github-token: ${{ secrets.STEWARD_TOKEN || secrets.GITHUB_TOKEN }}
