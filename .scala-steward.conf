# Scala Steward configuration for Leonardo (issue 5.2, phase 5).
#
# The 2026-09-01 audit found no known-vulnerable dependency, but nothing *watched* them.
# This is that watch: Steward opens a pull request per available update, CI runs the full
# suite against it, and the update is accepted or rejected on the evidence.

# ── spire is PINNED DELIBERATELY, and an automated bump would be a regression ──────────
#
# Issue 4.N chose spire 0.18.0 as the exact tier's irrational engine and pinned it on
# purpose: spire_3 has had exactly one stable release (June 2022) and its transitive
# `typelevel/algebra` is archived.  The licence (MIT) is what bounds that risk -- if spire
# is ever abandoned outright, the handful of `Real` sources can be vendored under Apache-2.0
# with the MIT notice preserved.  A Steward PR bumping it would be noise at best; ignore it
# here rather than closing the same pull request every week.
updates.ignore = [
  { groupId = "org.typelevel", artifactId = "spire" }
]

# Group the routine version bumps into one pull request per run, so a quiet week is one
# review rather than five.  Security-relevant updates still arrive as they are published.
pullRequests.grouping = [
  { name = "patches", "title" = "Patch updates", "filter" = [{ "version" = "patch" }] }
]

# Weekly is enough for a library with pinned, slow-moving dependencies.
updates.limit = 5
