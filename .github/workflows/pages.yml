name: Deploy documentation site to GitHub Pages

# Publishes the Leonardo support site: the "Just the Docs" prose (docs/src) at the site
# root, the Scaladoc API reference at /api, and the browser REPL at /app. Runs on every push
# to main; can also be triggered manually. One-time repo setup: Settings -> Pages -> Source =
# "GitHub Actions".

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the site changes.
    paths:
      - "docs/**"
      # core/ and repl/ rather than src/main/: the 5.2 module split moved every source out of
      # a top-level src/, which no longer exists -- so "src/main/**" silently matched NOTHING
      # and a library change stopped rebuilding the site at all. The published Scaladoc went
      # stale until some other path happened to fire. Found while adding web/ below.
      - "core/src/main/**"
      - "core/js-src/main/**"
      - "repl/src/main/**"
      - "repl/js-src/main/**"
      # The browser REPL is deployed from here too (F_0003 phase 4).
      - "web/**"
      - "build.sbt"
      - "project/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least-privilege token plus the permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ── Scaladoc API reference (the /api subfolder) ──────────────────────────
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Build API docs (mdoc verifies samples, unidoc renders, injectApiStyles adds the logo/CSS)
        # Both task names are project-qualified or plugin-specific since the 5.2 phase 1.1
        # module split, and the bare forms are WRONG rather than merely different:
        #   `docs/mdoc` -- MdocPlugin is enabled on the `docs` project, not root, so that mdoc
        #                  stays out of the published POM. Bare `mdoc` is not a valid task.
        #   `unidoc`    -- plain `doc` now writes core/target and repl/target separately and
        #                  produces NOTHING at target/scala-<version>/api, which is the path
        #                  the assemble step below copies. It would also drop `cli` from the
        #                  API.  (The version is deliberately not spelled here -- see below.)
        run: sbt "docs/mdoc; unidoc; injectApiStyles"

      # ── Browser REPL (the /app subfolder, F_0003 phase 4) ──────────────────
      - name: Link the browser REPL
        # `web` is deliberately outside the root aggregate, so it must be named: the task above
        # does not reach it. fullLinkJS rather than fastLinkJS because this is what ships --
        # 3.46 MB against fastLink's ~20 MB, and the gzipped figure is what a reader pays.
        run: sbt web/fullLinkJS

      # ── Jekyll prose site (Just the Docs over docs/src) ──────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build Jekyll site
        working-directory: docs
        # SOURCE IS target/mdoc, NOT docs/src -- that is, mdoc's OUTPUT, not its input.
        #
        # Building from the input published the samples unevaluated and with their mdoc
        # modifiers still in the fence. Two things went wrong with that: `scala mdoc:silent`
        # is not a language kramdown accepts (the colon), so those blocks rendered as
        # paragraphs with their newlines collapsed and the ``` visible; and every verified
        # result -- the whole point of running mdoc -- was missing from the page.
        #
        # Scaladoc already renders this directory (see `-siteroot` in build.sbt), so this
        # also makes the two published views of the prose agree. The `sbt` step above
        # produces it, so it exists by the time this runs.
        #
        # --trace prints a full backtrace when the build fails. Without it Jekyll reports
        # only 'Process completed with exit code 1', which is what let this step fail five
        # times before anyone could see why.
        run: bundle exec jekyll build --source ../target/mdoc --destination ../_site --config _config.yml --trace
        env:
          JEKYLL_ENV: production

      # ── Assemble: prose at root, API at /api, .nojekyll so the _-prefixed
      #    Scaladoc file names survive static serving. ───────────────────────────
      - name: Add API reference and .nojekyll
        # A GLOB, deliberately, and it is a Scala Steward matter rather than a style one.
        # Steward rewrites an outdated version literal wherever it appears -- comments
        # included, so no file may spell the Scala version, not even to explain this rule.
        # A hardcoded scala-<version> path here made Steward's Scala-bump branch edit THIS
        # FILE -- and pushing a change under
        # .github/workflows is refused for a PAT without the `workflow` scope, which failed
        # the entire run ('refusing to allow a Personal Access Token to create or update
        # workflow pages.yml'). Widening the PAT would have granted the automation the power
        # to rewrite the workflows that hold the signing key; dropping the literal keeps the
        # token minimal and this workflow valid across Scala bumps with no edit at all.
        # The glob is deterministic here: a fresh CI checkout builds exactly one
        # target/scala-* directory, and if none exists cp fails loudly.
        run: |
          cp -r target/scala-*/api _site/api
          touch _site/.nojekyll

      - name: Add the browser REPL at /app
        # Same glob reasoning as the API copy above: no file may spell the Scala version, or
        # Scala Steward's bump branch edits this workflow and the push is refused for want of
        # the `workflow` PAT scope. A fresh checkout links exactly one leonardo-web-opt, and
        # cp fails loudly if it linked none.
        #
        # Jekyll never sees any of this: it builds target/mdoc into _site, and /app is added
        # afterwards. So index.html is served exactly as written, with no front matter and no
        # Liquid processing -- which matters, because the page is full of {{ }}-free but
        # brace-heavy JavaScript that Liquid would otherwise be entitled to interpret.
        run: |
          mkdir -p _site/app
          cp web/index.html _site/app/index.html
          cp web/target/scala-*/leonardo-web-opt/main.js _site/app/main.js
          cp -r web/vendor _site/app/vendor

      - name: Verify the deployed app is complete
        # Cheap, and it guards the failure mode this layout actually has: a page that loads,
        # renders its chrome, and then does nothing because one file was not copied. Checking
        # here means a broken deployment never reaches the site.
        run: |
          test -s _site/app/index.html
          test -s _site/app/main.js
          test -s _site/app/vendor/plotly.min.js
          test -s _site/app/vendor/mathlive/mathlive.min.js
          test -s _site/app/vendor/mathlive/mathlive-static.css
          # The fonts are the half most easily lost: the CSS references them by relative path,
          # so a missing fonts/ directory leaves a page that typesets into invisible glyphs
          # rather than one that fails.
          test "$(ls _site/app/vendor/mathlive/fonts/*.woff2 | wc -l)" -eq 20
          grep -q 'leonardoStart' _site/app/main.js
          echo "app: $(stat -c%s _site/app/main.js) bytes of Leonardo, $(stat -c%s _site/app/vendor/plotly.min.js) of Plotly, $(stat -c%s _site/app/vendor/mathlive/mathlive.min.js) of MathLive"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
