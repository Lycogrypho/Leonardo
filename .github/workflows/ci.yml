name: CI

# The continuous-integration build: compile and run the full suite on every push and pull
# request. This is what the build badge in README.md reports, and it is what makes a Scala
# Steward dependency-update PR meaningful -- an update is accepted or rejected on the evidence
# of a green suite, which requires that the suite actually runs on the PR.
#
# Deliberately separate from release.yml, which runs only on a version tag: a release must not
# be a side effect of an ordinary push, and CI must not need the signing secrets.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the in-flight run: the older result is about
# to be superseded and would only burn a runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Test
        # Aggregated from the root project, which since the Scala.js cross-build (F_0003)
        # covers THREE suites: 1781 library on the JVM, the same 1781 on Node, and 284 REPL.
        # `core.js` is aggregated precisely so that a bare `sbt test` cannot forget it.
        #
        # Node is required for the Scala.js run and the runner image already provides it, so
        # there is no setup step -- if that ever changes, this is the job that goes red first.
        run: sbt test

      - name: Browser front end
        # The `web` project is deliberately NOT in the root aggregate -- linking a bundle on
        # every `sbt test` would put front-end work in the path of every library change -- so
        # it has to be named here or it would never be built at all.
        #
        # check-web-app.js is the part worth having: it drives the linked bundle's entry point
        # against a minimal fake DOM, which is the only thing that checks index.html's element
        # ids against App.scala. A typo there is invisible until someone opens the page; this
        # turns it into a red build. It also pins that a line still evaluates, that the history
        # keys work, and that `plot` emits a document Plotly could read -- including that a
        # coordinates plot carries its aspect lock, which is the whole reason Plotly was chosen
        # over Vega-Lite (F_0003 Decision 1).
        #
        # The sizes are PRINTED, not asserted: a threshold would be either so loose it never
        # fires or so tight it fails on an unrelated Scala.js release. A figure in the log lets
        # a regression be seen by comparing two runs, which is what anyone would actually do.
        run: |
          sbt web/test web/fullLinkJS
          node .github/scripts/check-web-app.js
          bundle=web/target/scala-3.3.6/leonardo-web-opt/main.js
          echo "leonardo: $(stat -c%s $bundle) raw / $(gzip -c $bundle | wc -c) gzipped"
          echo "plotly:   $(stat -c%s web/vendor/plotly.min.js) raw / $(gzip -c web/vendor/plotly.min.js | wc -c) gzipped"

      - name: Encoding hygiene
        # Guards the issue-2.8 repair. 27 test files had accumulated UTF-8-read-as-cp1252
        # mojibake, largely by copy-paste from an already-damaged neighbour, so a one-time
        # sweep would decay the same way. Neither script needs anything beyond the python3
        # the runner already has.
        #
        # Two checks, because the repair itself can err: reversing the round-trip on text
        # that was never damaged occasionally yields valid UTF-8 by coincidence (`×–` becomes
        # Hebrew ZAYIN). check-charset catches that class by flagging any script this
        # codebase cannot legitimately contain.
        run: |
          python3 .github/scripts/fix-mojibake.py --check core/src repl/src web/src docs
          python3 .github/scripts/check-charset.py core/src repl/src web/src docs

      - name: Action pinning
        # Guards the issue-2.10 sweep the way "Encoding hygiene" guards 2.8's: both were
        # one-time repairs of a condition that decays silently. Every `uses:` must name a
        # commit SHA, because a tag is mutable and `ruby/setup-ruby@v1` is a *branch* -- so
        # an unpinned action lets its owner change what runs in release.yml, which holds the
        # GPG key, and scala-steward.yml, which holds a repository-writing PAT.
        #
        # Added with the fifth workflow (issue 2.14), the first addition since 2.10 where
        # keeping the invariant rested purely on remembering it.
        run: python3 .github/scripts/check-action-pins.py

      - name: Binary compatibility
        # Checks both published modules against the `mimaBaseline` in build.sbt (issue 2.9).
        # `versionScheme := early-semver` promises that a patch release stays binary-compatible;
        # this is what enforces it. An intended break is declared in `mimaBinaryIssueFilters`
        # with a comment, so the diff shows the decision rather than hiding it.
        run: sbt mimaReportBinaryIssues

      - name: Scaladoc
        # `doc`, not `unidoc`: this is the per-module API that `packageDoc` publishes as the
        # -javadoc.jar, so a release cannot fail on a documentation error that CI never saw.
        # The full site (unidoc + mdoc + PlantUML) is built by pages.yml instead.
        run: sbt doc
