# Scala Steward configuration for Leonardo (issue 5.2, phase 5).
#
# The 2026-09-01 audit found no known-vulnerable dependency, but nothing *watched* them.
# This is that watch: Steward opens a pull request per available update, CI runs the full
# suite against it, and the update is accepted or rejected on the evidence.

# ── spire is PINNED DELIBERATELY, and an automated bump would be a regression ──────────
#
# Issue 4.N chose spire 0.18.0 as the exact tier's irrational engine and pinned it on
# purpose: spire_3 has had exactly one stable release (June 2022) and its transitive
# `typelevel/algebra` is archived.  The licence (MIT) is what bounds that risk -- if spire
# is ever abandoned outright, the handful of `Real` sources can be vendored under Apache-2.0
# with the MIT notice preserved.  A Steward PR bumping it would be noise at best; ignore it
# here rather than closing the same pull request every week.
# ── scala-parser-combinators is HELD AT 2.4.0, and this one is a compatibility floor ─────
#
# F_0025 (2026-09-22).  The 2.5.0 Scala 3 artifact is compiled to Java 17 bytecode -- class
# file major 61, against 2.4.0's major 52 -- to use the new `lazy val` encoding.  Leonardo's
# own published jars are major 52, so taking 2.5.0 would raise the JDK floor from 8 to 17 for
# every consumer of `it.grypho:leonardo`, since this is a compile-scope dependency in the POM.
#
# Neither guard catches it: MiMa sees no signature change, because a class-file version is not
# binary incompatibility in its sense, and CI is green because every workflow pins JDK 17.  The
# release carries no fix and no feature this library uses, so the trade would be a narrowed
# runtime for nothing.  Revisit only if JDK 17 is adopted as a declared floor on purpose.
updates.ignore = [
  { groupId = "org.typelevel",          artifactId = "spire" },
  { groupId = "org.scala-lang.modules", artifactId = "scala-parser-combinators" }
]

# ── Major lines are PINNED to the ones the project has committed to (2026-10-01) ────────
#
# A pin differs from an ignore on purpose: patch and minor updates within the line still
# arrive as pull requests, only the major jump is withheld.  Three lines, three reasons,
# each with a ToDo entry stating its revisit condition:
#
#   scala3-library 3.3.  — F_0047. Leonardo publishes for Scala 3.3 LTS, a commitment stated
#                          in the README, the POM and the Scaladex listing; leaving the line
#                          is a positioning decision, not a bump. Revisit at the next LTS.
#   jline 3.             — F_0048. JLine 4 is a major release touching exactly the APIs the
#                          REPL uses (LineReader, key maps, AttributedStyle); repl-only blast
#                          radius, but its JDK floor must be read before any move.
#   sbt 1.               — F_0049. sbt 2 changes the plugin ABI, so the migration is gated on
#                          every loaded plugin having an sbt-2 release, not on sbt itself.
#
# The alert caveat is the same one the ignores above carry: a withheld major is invisible in
# Steward's PRs, so the D_0030 dependency-graph alerts are the security backstop.
updates.pin = [
  { groupId = "org.scala-lang", artifactId = "scala3-library", version = "3.3." },
  { groupId = "org.jline",      artifactId = "jline",          version = "3." },
  { groupId = "org.scala-sbt",  artifactId = "sbt",            version = "1." }
]

# Group the routine version bumps into one pull request per run, so a quiet week is one
# review rather than five.  Security-relevant updates still arrive as they are published.
pullRequests.grouping = [
  { name = "patches", "title" = "Patch updates", "filter" = [{ "version" = "patch" }] }
]

# Weekly is enough for a library with pinned, slow-moving dependencies.
updates.limit = 5
